<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SincroPareja</title>

  <!-- Configuración PWA (Apariencia de App Nativa) -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SincroPareja">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- OneSignal Web Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        // ⚠️ REEMPLAZA CON TU APP ID DE ONESIGNAL
        appId: "TU_ONESIGNAL_APP_ID",
      });
    });
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12 select-none">

  <!-- Encabezado -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>💜</span> SincroPareja
      </h1>
      <span id="syncStatus" class="text-xs bg-indigo-500 px-2.5 py-1 rounded-full font-medium transition-all">Sincronizando...</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Configuración del Ciclo -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Configuración del Ciclo</h2>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Último Periodo</label>
          <input type="date" id="fumInput" onchange="guardarYActualizar()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Duración (Días)</label>
          <input type="number" id="duracionInput" value="28" onchange="guardarYActualizar()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
    </section>

    <!-- Estado Actual y Alerta Hormonal -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
      <div class="flex justify-between items-start">
        <div>
          <span id="faseBadge" class="text-xs font-bold px-3 py-1 rounded-full bg-slate-100 text-slate-600">Calculando...</span>
          <h3 id="diaCicloText" class="text-2xl font-black text-slate-800 mt-2">Día --</h3>
        </div>
        <div class="text-right">
          <span class="text-xs text-slate-400 block">Próximo periodo</span>
          <span id="proxPeriodoText" class="text-sm font-semibold text-slate-700">--/--/----</span>
        </div>
      </div>

      <div id="alertaBox" class="p-4 rounded-xl border border-slate-100 bg-slate-50 space-y-1">
        <div class="flex items-center gap-2 font-bold text-sm" id="alertaTitulo">
          <span>🧠</span> Estado Neurológico y Hormonal
        </div>
        <p id="alertaTexto" class="text-xs leading-relaxed text-slate-600">Cargando...</p>
      </div>
    </section>

    <!-- Check-in Diario (Ella) -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Check-in Diario (Ella)</h2>
      
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-2">Batería Social y Sensorial</label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="setBateria('Baja')" id="btnBatBaja" class="bat-btn border border-slate-200 p-2.5 rounded-xl text-center transition-all">
            <span class="block text-lg">🪫</span>
            <span class="text-xs font-medium">Baja (20%)</span>
          </button>
          <button onclick="setBateria('Media')" id="btnBatMedia" class="bat-btn border border-slate-200 p-2.5 rounded-xl text-center transition-all">
            <span class="block text-lg">🔋</span>
            <span class="text-xs font-medium">Media (50%)</span>
          </button>
          <button onclick="setBateria('Alta')" id="btnBatAlta" class="bat-btn border border-slate-200 p-2.5 rounded-xl text-center transition-all">
            <span class="block text-lg">⚡</span>
            <span class="text-xs font-medium">Alta (100%)</span>
          </button>
        </div>
      </div>

      <div class="space-y-3 pt-2">
        <label class="flex items-center justify-between p-3 bg-slate-50 rounded-xl cursor-pointer hover:bg-slate-100 transition-colors">
          <span class="text-xs font-medium text-slate-700">🧠 Fatiga de Decisión (Cerebro saturado)</span>
          <input type="checkbox" id="fatigaCheck" onchange="guardarYActualizar()" class="w-4 h-4 accent-indigo-600 rounded">
        </label>
        <label class="flex items-center justify-between p-3 bg-slate-50 rounded-xl cursor-pointer hover:bg-slate-100 transition-colors">
          <span class="text-xs font-medium text-slate-700">🛡️ Sensibilidad / RSD (Vulnerabilidad alta)</span>
          <input type="checkbox" id="rsdCheck" onchange="guardarYActualizar()" class="w-4 h-4 accent-indigo-600 rounded">
        </label>
      </div>
    </section>

    <!-- Guía de Acción Directa para Él -->
    <section class="bg-indigo-900 text-white p-5 rounded-2xl shadow-md space-y-3">
      <h2 class="text-xs font-bold text-indigo-300 uppercase tracking-wider">Acción Sugerida para Él</h2>
      <p id="accionMasculina" class="text-sm font-medium leading-relaxed">Esperando datos...</p>
    </section>

  </main>

  <!-- Módulos de Firebase SDK v9 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // ⚠️ REEMPLAZA ESTE OBJETO CON TUS DATOS REALES DE FIREBASE
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com",
      projectId: "TU_PROYECTO",
      storageBucket: "TU_PROYECTO.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const estadoRef = ref(db, 'estado_pareja');

    let estadoActual = {
      fum: new Date().toISOString().split('T')[0],
      duracion: 28,
      bateria: 'Media',
      fatiga: false,
      rsd: false
    };

    // Escuchar cambios en tiempo real
    onValue(estadoRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        estadoActual = data;
        renderApp(data);
        document.getElementById('syncStatus').innerText = "🟢 Sincronizado";
        document.getElementById('syncStatus').className = "text-xs bg-emerald-500 px-2.5 py-1 rounded-full font-medium shadow-sm";
      }
    });

    // Guardar cambios en Firebase y disparar notificación
    window.guardarYActualizar = function() {
      estadoActual.fum = document.getElementById('fumInput').value;
      estadoActual.duracion = parseInt(document.getElementById('duracionInput').value) || 28;
      estadoActual.fatiga = document.getElementById('fatigaCheck').checked;
      estadoActual.rsd = document.getElementById('rsdCheck').checked;

      set(estadoRef, estadoActual);
      enviarNotificacionPush(estadoActual);
    };

    window.setBateria = function(nivel) {
      estadoActual.bateria = nivel;
      window.guardarYActualizar();
    };

    // Envío automático de notificaciones vía OneSignal REST API
    async function enviarNotificacionPush(data) {
      const REST_API_KEY = "TU_ONESIGNAL_REST_API_KEY"; // ⚠️ Tu clave REST API
      const APP_ID = "TU_ONESIGNAL_APP_ID";             // ⚠️ Tu App ID

      if (REST_API_KEY === "TU_ONESIGNAL_REST_API_KEY") return; // Si no está configurado, ignora

      let mensaje = "";
      if (data.rsd && data.fatiga) {
        mensaje = "⚠️ Ella activó Modo Protección Máxima (Fatiga de decisión + RSD).";
      } else if (data.fatiga) {
        mensaje = "🍲 Ella registró Fatiga de Decisión Activa para hoy.";
      } else if (data.bateria === "Baja") {
        mensaje = "🪫 Batería Social/Sensorial registrada en 20%.";
      }

      if (mensaje) {
        try {
          await fetch("https://onesignal.com/api/v1/notifications", {
            method: "POST",
            headers: {
              "Content-Type": "application/json; charset=utf-8",
              "Authorization": `Basic ${REST_API_KEY}`
            },
            body: JSON.stringify({
              app_id: APP_ID,
              included_segments: ["Subscribed Users"],
              headings: { "es": "💜 SincroPareja: Actualización" },
              contents: { "es": mensaje }
            })
          });
        } catch (e) {
          console.error("Error al enviar push:", e);
        }
      }
    }

    function renderApp(data) {
      document.getElementById('fumInput').value = data.fum || '';
      document.getElementById('duracionInput').value = data.duracion || 28;
      document.getElementById('fatigaCheck').checked = !!data.fatiga;
      document.getElementById('rsdCheck').checked = !!data.rsd;

      // Botones de batería
      ['Baja', 'Media', 'Alta'].forEach(b => {
        const btn = document.getElementById(`btnBat${b}`);
        if (data.bateria === b) {
          btn.className = "bat-btn border p-2.5 rounded-xl text-center bg-indigo-50 border-indigo-500 font-semibold shadow-sm";
        } else {
          btn.className = "bat-btn border border-slate-200 p-2.5 rounded-xl text-center hover:bg-slate-50";
        }
      });

      // Cálculo de ciclo
      const fum = new Date(data.fum);
      const hoy = new Date();
      if (!isNaN(fum.getTime())) {
        const diaCiclo = Math.floor((hoy - fum) / (1000 * 3600 * 24)) + 1;
        const prox = new Date(fum);
        prox.setDate(fum.getDate() + parseInt(data.duracion));

        document.getElementById('diaCicloText').innerText = `Día ${diaCiclo}`;
        document.getElementById('proxPeriodoText').innerText = prox.toLocaleDateString('es-ES');

        let fase = "", color = "", tit = "", txt = "";
        if (diaCiclo <= 5) {
          fase = "1. Menstrual"; color = "bg-rose-100 text-rose-700";
          tit = "🩸 Caída Hormonal"; txt = "Baja energía física. Priorizar descanso e hidratación.";
        } else if (diaCiclo <= 13) {
          fase = "2. Folicular"; color = "bg-emerald-100 text-emerald-700";
          tit = "🌱 Subida de Estrógenos"; txt = "Aumenta la dopamina y creatividad. Excelente momento para actividades juntos.";
        } else if (diaCiclo <= 16) {
          fase = "3. Ovulatoria"; color = "bg-sky-100 text-sky-700";
          tit = "✨ Ventana Fértil"; txt = "Pico hormonal de fertilidad y energía.";
        } else {
          fase = "4. Lútea / SPM"; color = "bg-amber-100 text-amber-800";
          tit = "⚠️ Fase Lútea (Progesterona)"; txt = "Descenso de dopamina. Mayor sensibilidad a sobrecarga sensorial y TDAH.";
        }

        document.getElementById('faseBadge').innerText = fase;
        document.getElementById('faseBadge').className = `text-xs font-bold px-3 py-1 rounded-full ${color}`;
        document.getElementById('alertaTitulo').innerHTML = tit;
        document.getElementById('alertaTexto').innerText = txt;
      }

      // Guía para Él
      let accion = "🟢 Estado Fluido: Buen momento para coordinar metas o compartir rutinas.";
      if (data.rsd && data.fatiga) {
        accion = "🛡️ MODO PROTECCIÓN MÁXIMA: Alta saturación y sensibilidad. Toma el control práctico del hogar sin hacerle preguntas de opción múltiple.";
      } else if (data.fatiga) {
        accion = "🍲 FATIGA DE DECISIÓN ACTIVA: Evita preguntarle qué hacer/cenar. Asume la decisión tú directamente.";
      } else if (data.rsd) {
        accion = "💬 Sensibilidad Emocional (RSD): Ofrece contención y afirmación de seguridad ('estoy aquí, somos un equipo'). Evita el tono crítico.";
      } else if (data.bateria === 'Baja') {
        accion = "🪫 Batería Baja: Facilítale un espacio tranquilo libre de exigencias o interacciones sociales externas.";
      }
      document.getElementById('accionMasculina').innerText = accion;
    }
  </script>
</body>
</html>
